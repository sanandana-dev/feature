<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Plain White Background -->
  <rect width="400" height="400" fill="#ffffff" />
  
  <!-- T-Shirt Body and Sleeves (Navy / Indigo) -->
  <path d="M 140 70 
           Q 170 82 200 82 
           Q 230 82 260 70 
           L 330 115 
           L 300 170 
           L 260 148 
           L 260 340 
           L 140 340 
           L 140 148 
           L 100 170 
           L 70 115 Z" 
        fill="#1e3a8a" 
        stroke="#172554" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Inner Collar Ribbing -->
  <path d="M 140 70 Q 200 110 260 70 Q 200 85 140 70 Z" fill="#0f172a" />
  
  <!-- Collar Line -->
  <path d="M 140 70 Q 200 110 260 70" fill="none" stroke="#3b82f6" stroke-width="2" />
  
  <!-- Sleeve Stitching Detail -->
  <line x1="285" y1="135" x2="268" y2="162" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" />
  <line x1="115" y1="135" x2="132" y2="162" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3" />
  
  <!-- Bottom Hem Stitching Detail -->
  <line x1="145" y1="330" x2="255" y2="330" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" />
</svg>
